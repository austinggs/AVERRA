name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Client bundle secret scan
        run: npm run check:bundle
      # Catches truncated or duplicated PL/pgSQL bodies without needing a database.
      # Two such defects shipped in this repository before this gate existed.
      - name: Migration structure check
        run: npm run check:migrations
      # Catches `.from('some_app_table')`, which cannot work: the `app` schema is
      # not exposed through the Data API. Twelve such call sites shipped in this
      # repository before this gate existed, including the provider callback
      # evidence write, which meant no provider callback was ever recorded.
      - name: Data API access check
        run: npm run check:data-api
      # Catches a function in `public` that never revokes EXECUTE from anon,
      # `authenticated` and the PUBLIC pseudo-role. A function in the exposed
      # schema is BORN executable by an unauthenticated caller, and 29 wrappers
      # were reachable with the publishable key until migration 036 closed it.
      # Verified live before this gate existed, which is how it was found.
      - name: Function grant check
        run: npm run check:grants
      # Catches a Server Component CALLING a value exported from a 'use client'
      # module. tsc, eslint, vitest and `next build` all accept that and the page
      # throws only on render - which is exactly how the earn page shipped in
      # CR-0040, with an aria-labelledby built from a client reference.
      - name: Server/client boundary check
        run: npm run check:server-imports

  # Database tests (pgTAP) run only when a database is reachable.
  # They are intentionally NOT a launch gate for migrations that have not yet
  # been pushed. Enable by providing SUPABASE_DB_URL as a repository secret.
  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The presence test is a SHELL test, deliberately NOT a job-level `if`. The
      # `secrets` context is not available to `jobs.<job_id>.if`, and GitHub does
      # not merely treat that as false - it rejects the whole workflow file with
      # "Unrecognized named-value: 'secrets'". A job-level guard here would
      # invalidate CI, not skip the job.
      #
      # The URL is passed through the environment rather than the command line, and
      # is never echoed, so it cannot reach the job log.
      #
      # `--require-db` makes a missing URL FATAL instead of a skip, so this job
      # cannot go green having executed nothing. The runner applies the same rule
      # to an individual suite: one that produces no assertions fails rather than
      # passing quietly. Both guards exist because a `0 bad` result from an empty
      # population was once reported in this repository as a security assurance.
      #
      # The secret must be the POOLER connection string, NOT the direct one:
      #   postgres://postgres.<project-ref>:<password>@aws-1-<region>.pooler.supabase.com:5432/postgres
      # `db.<project-ref>.supabase.co` has resolved to IPv6 ONLY since January 2024
      # (Supabase "PGBouncer and IPv4 Deprecation"), and a GitHub-hosted runner has no
      # IPv6 route, so the direct URL fails this job with `getaddrinfo ENOTFOUND`
      # before a single assertion runs. Supabase names GitHub Actions explicitly as an
      # environment that must use Supavisor, which still returns IPv4. The same rule
      # applies to `supabase db push` run from this machine.
      - name: Run database tests
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning title=Database tests did NOT run::SUPABASE_DB_URL is not configured as a repository secret, so the 10 pgTAP suites were skipped. Add it to enable this gate."
            exit 0
          fi
          npm run test:db -- --require-db
